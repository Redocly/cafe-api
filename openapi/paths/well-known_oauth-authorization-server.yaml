get:
  tags:
    - Authorization
  summary: Retrieve authorization server metadata
  description: |
    OAuth2 authorization server metadata (RFC 8414). Lists the authorization,
    token, registration, and revocation endpoints along with the supported
    scopes, grant types, client authentication methods, and PKCE code challenge
    methods, so clients can discover the server's capabilities instead of
    hard-coding them.
  operationId: getAuthorizationServerMetadata
  security: []
  responses:
    '200':
      description: Authorization server metadata.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthorizationServerMetadata.yaml
          examples:
            Metadata:
              dataValue:
                issuer: https://api.cafe.redocly.com
                authorization_endpoint: https://api.cafe.redocly.com/oauth2/authorize
                token_endpoint: https://api.cafe.redocly.com/oauth2/token
                registration_endpoint: https://api.cafe.redocly.com/oauth2/register
                revocation_endpoint: https://api.cafe.redocly.com/oauth2/revoke
                scopes_supported:
                  - menu:read
                  - menu:write
                  - orders:read
                  - orders:write
                  - revenue:read
                response_types_supported:
                  - code
                response_modes_supported:
                  - query
                grant_types_supported:
                  - authorization_code
                  - client_credentials
                  - refresh_token
                token_endpoint_auth_methods_supported:
                  - client_secret_basic
                  - client_secret_post
                revocation_endpoint_auth_methods_supported:
                  - client_secret_basic
                  - client_secret_post
                code_challenge_methods_supported:
                  - S256
                  - plain
                authorization_response_iss_parameter_supported: true
                service_documentation: https://cafe.redocly.com/openapi/cafe
    '500':
      $ref: ../components/responses/OAuth2ServerError.yaml
