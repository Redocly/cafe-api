description: |
  OAuth2 error (RFC 6749 Section 5.2 / RFC 7591 Section 3.2.2).
  The `error` field carries the standard OAuth2 error code.
content:
  application/json:
    schema:
      $ref: ../schemas/OAuthError.yaml
    examples:
      InvalidGrant:
        summary: Refresh token is invalid or expired
        dataValue:
          error: invalid_grant
          error_description: Invalid refresh token
      InvalidClientMetadata:
        summary: Requested scope does not exist
        dataValue:
          error: invalid_client_metadata
          error_description: "scopes: Invalid enum value. Expected 'menu:read' | 'menu:write' | 'orders:read' | 'orders:write' | 'revenue:read', received 'admin'"
