description: Invalid client metadata (RFC 7591 Section 3.2.2).
content:
  application/json:
    schema:
      $ref: ../schemas/OAuthError.yaml
    examples:
      InvalidClientMetadata:
        summary: Requested scope does not exist
        dataValue:
          error: invalid_client_metadata
          error_description: "scopes: Invalid enum value. Expected 'menu:read' | 'menu:write' | 'orders:read' | 'orders:write' | 'revenue:read', received 'admin'"
