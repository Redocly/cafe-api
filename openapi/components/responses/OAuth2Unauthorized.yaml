description: |
  Client authentication failed (`error: invalid_client`, RFC 6749 Section 5.2).
  When the client used HTTP Basic, the response carries a `WWW-Authenticate: Basic` challenge.
headers:
  WWW-Authenticate:
    description: 'Authentication challenge, for example: `Basic realm="redocly-cafe"`.'
    schema:
      type: string
content:
  application/json:
    schema:
      $ref: ../schemas/OAuthError.yaml
    examples:
      InvalidClient:
        summary: Wrong client_id or client_secret
        dataValue:
          error: invalid_client
          error_description: Invalid client credentials
