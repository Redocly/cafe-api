description: |
  Client authentication failed (`error: invalid_client`, RFC 6749 Section 5.2) or the presented bearer token is invalid (`error: invalid_token`, RFC 6750).
  The response carries a `WWW-Authenticate` challenge naming the expected authentication scheme.
headers:
  WWW-Authenticate:
    description: 'Authentication challenge, for example: `Basic realm="redocly-cafe"` or `Bearer realm="redocly-cafe", error="invalid_token"`.'
    schema:
      type: string
content:
  application/json:
    schema:
      $ref: ../schemas/OAuthError.yaml
    examples:
      InvalidClient:
        summary: Wrong client_id or client_secret
        dataValue:
          error: invalid_client
          error_description: Invalid client credentials
      InvalidToken:
        summary: Wrong registration access token
        dataValue:
          error: invalid_token
          error_description: Invalid registration access token
