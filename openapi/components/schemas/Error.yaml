type: object
properties:
  type:
    type: string
    format: uri-reference
    description: URI reference that identifies the problem type.
    default: about:blank
    examples:
      - about:blank
  title:
    type: string
    description: Short summary of the problem type.
    examples:
      - Order not found
  status:
    type: integer
    format: int32
    description: |
      HTTP status code generated by the origin server for this occurrence of the problem.
    minimum: 100
    exclusiveMaximum: 600
    examples:
      - 404
  instance:
    type: string
    format: uri-reference
    description: |
      URI reference that identifies the specific occurrence of the problem, e.g. by adding a fragment identifier or sub-path to the problem type.
      Can be used to locate the root of this problem in the source code.
    examples:
      - /orders/ord_01h1s5z6vf2mm1mz3hevnn9va7
  details:
    description: Additional error details.
    type: object
    additionalProperties: true
required:
  - type
  - title
  - status
