title: client_credentials
description: >-
  `grant_types` is provided and does not include `authorization_code` —
  typically machine-to-machine clients using `client_credentials`.
  No redirect URI is needed.
allOf:
  - $ref: ./RegisterClientMetadata.yaml
  - type: object
    required:
      - grant_types
    properties:
      grant_types:
        not:
          contains:
            const: authorization_code
