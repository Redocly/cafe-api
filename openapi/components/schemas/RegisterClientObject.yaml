type: object
description: |
  Client registration metadata per RFC 7591 Section 2.
  Standard snake_case metadata names (`client_name`, `redirect_uris`, `grant_types`, `scope`,
  `token_endpoint_auth_method`) and this API's camelCase aliases (`name`, `redirectUris`,
  `grantTypes`, `scopes`, `tokenEndpointAuthMethod`) are both accepted.
  When both spellings of a field are present, the standard snake_case one takes precedence.
  All fields are optional, with one conditional exception enforced by the schema below:
  `redirect_uris` is required whenever the effective grant types include `authorization_code` —
  including when `grant_types` is omitted, since the default includes it (RFC 7591 Section 2).
properties:
  client_name:
    type: string
    description: Human-readable client name, shown on the authorization consent screen.
  redirect_uris:
    type: array
    items:
      type: string
      format: uri
    description: |
      Redirect URIs for the `authorization_code` grant. Compared with exact string
      matching at authorization time (RFC 6749 Section 3.1.2.3). Required when the
      effective grant types include `authorization_code`.
  scope:
    type: string
    description: Space-separated list of scopes. Defaults to all available scopes.
    default: menu:read menu:write orders:read orders:write revenue:read
    pattern: '^(menu:read|menu:write|orders:read|orders:write|revenue:read)( (menu:read|menu:write|orders:read|orders:write|revenue:read))*$'
    example: menu:read orders:read orders:write
  grant_types:
    type: array
    items:
      type: string
      enum:
        - authorization_code
        - client_credentials
        - refresh_token
    default:
      - authorization_code
      - client_credentials
      - refresh_token
    description: |
      Grant types the client may use. A refresh token is issued with `authorization_code`
      grant responses only when `refresh_token` is included here; the `client_credentials`
      grant never returns one (RFC 6749 Section 4.4.3).
  token_endpoint_auth_method:
    type: string
    enum:
      - client_secret_basic
      - client_secret_post
    default: client_secret_basic
    description: |
      Requested client authentication method for the token endpoint, registered as
      client metadata and echoed in registration responses. Defaults to
      `client_secret_basic` (RFC 7591 Section 2). Informational: the token and
      revocation endpoints accept both methods for every client regardless.
  name:
    type: string
    description: Alias for `client_name`; used when `client_name` is absent.
  redirectUris:
    type: array
    items:
      type: string
      format: uri
    description: Alias for `redirect_uris`; used when `redirect_uris` is absent.
  scopes:
    type: array
    items:
      type: string
      enum:
        - menu:read
        - menu:write
        - orders:read
        - orders:write
        - revenue:read
    description: Alias for `scope`, as an array instead of a space-separated string; used when `scope` is absent.
  grantTypes:
    type: array
    items:
      type: string
      enum:
        - authorization_code
        - client_credentials
        - refresh_token
    description: Alias for `grant_types`; used when `grant_types` is absent.
  tokenEndpointAuthMethod:
    type: string
    enum:
      - client_secret_basic
      - client_secret_post
    description: Alias for `token_endpoint_auth_method`; used when `token_endpoint_auth_method` is absent.
# RFC 7591 Section 2: redirect-based grants require redirect URIs. The condition
# mirrors the server's alias handling — the standard grant_types wins over the
# grantTypes alias when both are present, and omitting both applies the default,
# which includes authorization_code.
if:
  anyOf:
    - required:
        - grant_types
      properties:
        grant_types:
          contains:
            const: authorization_code
    - allOf:
        - not:
            required:
              - grant_types
            properties:
              grant_types: {}
        - required:
            - grantTypes
          properties:
            grantTypes:
              contains:
                const: authorization_code
    - not:
        anyOf:
          - required:
              - grant_types
            properties:
              grant_types: {}
          - required:
              - grantTypes
            properties:
              grantTypes: {}
# The effective redirect list follows the same precedence: redirect_uris when
# present, otherwise the redirectUris alias — and the effective one must be
# non-empty.
then:
  anyOf:
    - required:
        - redirect_uris
      properties:
        redirect_uris:
          minItems: 1
    - allOf:
        - not:
            required:
              - redirect_uris
            properties:
              redirect_uris: {}
        - required:
            - redirectUris
          properties:
            redirectUris:
              minItems: 1
