type: object
properties:
  name:
    type: string
    description: Client name.
  redirectUris:
    type: array
    items:
      type: string
      format: uri
    default: []
    description: List of redirect URIs (optional, defaults to empty array).
  scopes:
    type: array
    items:
      type: string
      enum:
        - menu:read
        - menu:write
        - orders:read
        - orders:write
        - revenue:read
    default:
      - menu:read
      - menu:write
      - orders:read
      - orders:write
      - revenue:read
    description: List of scopes.
  grantTypes:
    type: array
    items:
      type: string
      enum:
        - authorization_code
        - client_credentials
        - refresh_token
    default:
      - authorization_code
      - client_credentials
    description: List of grant types. Include `refresh_token` alongside `authorization_code` to let the client exchange refresh tokens for new access tokens.
required:
  - name
