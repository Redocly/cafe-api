type: object
description: |
  Client registration metadata fields per RFC 7591 Section 2, shared by both
  registration variants.
properties:
  client_name:
    type: string
    description: Human-readable client name, displayed on the authorization consent screen.
  scope:
    type: string
    description: Space-separated list of scopes.
      Defaults to all available scopes.
    default: menu:read menu:write orders:read orders:write revenue:read
    pattern: '^(menu:read|menu:write|orders:read|orders:write|revenue:read)( (menu:read|menu:write|orders:read|orders:write|revenue:read))*$'
    example: menu:read orders:read orders:write
  grant_types:
    type: array
    items:
      type: string
      enum:
        - authorization_code
        - client_credentials
        - refresh_token
    default:
      - authorization_code
      - client_credentials
      - refresh_token
    description: |
      Grant types the client may use.
      A refresh token is issued with `authorization_code` grant responses only when `refresh_token` is included here.
      The `client_credentials` grant never returns one (RFC 6749 Section 4.4.3).
  token_endpoint_auth_method:
    type: string
    enum:
      - client_secret_basic
      - client_secret_post
    default: client_secret_basic
    description: |
      Requested client authentication method for the token endpoint, registered as client metadata and echoed in registration responses.
      Defaults to `client_secret_basic` (RFC 7591 Section 2).
      The token and revocation endpoints accept both methods for every client regardless.
