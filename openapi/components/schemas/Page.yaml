type: object
properties:
  nextPage:
    type:
      - string
      - 'null'
    format: uri-reference
    description: |-
      Path of the next page, relative to the API server URL.
      Append the value to the server URL to get the next page.
      The path keeps the query parameters of the request and sets `after` to the cursor of the next page.
      When `null`, there is no next page.
    examples:
      - /menu?limit=10&after=G0EAAIyUqm8V
  previousPage:
    type:
      - string
      - 'null'
    format: uri-reference
    description: |-
      Path of the previous page, relative to the API server URL.
      Append the value to the server URL to get the previous page.
      The path keeps the query parameters of the request and sets `before` to the cursor of the previous page.
      When `null`, there is no previous page.
    examples:
      - /menu?limit=10&before=G0EAAIyUqm8W
  limit:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
    description: Value showing how many items are in the page limit.
    examples:
      - 10
required:
  - nextPage
  - previousPage
  - limit
