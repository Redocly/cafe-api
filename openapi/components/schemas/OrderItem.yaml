type: object
properties:
  menuItemId:
    type: string
    description: ID of the menu item to add to the order.
    writeOnly: true
    examples:
      - prd_0000000000seedcffee0000000
  menuItem:
    $ref: ./MenuItem.yaml
    readOnly: true
    description: Menu item that is part of the order.
  quantity:
    type: integer
    minimum: 1
    description: Quantity of the menu item.
    examples:
      - 2
  discount:
    type: integer
    minimum: 0
    description: Discount amount in cents (absolute value).
    default: 0
    examples:
      - 0
  comment:
    type: string
    maxLength: 500
    description: Optional comment for the order item (e.g., "No sugar").
    examples:
      - No sugar!
required:
  - menuItemId
  - quantity
